# Bootstrap vhost for ACME validation, before the HTTPS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name sk.zenify.cx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://sk.zenify.cx$request_uri;
    }
}
