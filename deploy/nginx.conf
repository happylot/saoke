server {
    listen 80;
    listen [::]:80;
    server_name sk.zenify.cx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://sk.zenify.cx$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sk.zenify.cx;

    ssl_certificate /etc/letsencrypt/live/sk.zenify.cx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sk.zenify.cx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/saoke/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8175;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # Database and backend source are never served as static files.
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /version.txt { default_type text/plain; try_files $uri =404; }
    location / { return 404; }
}
